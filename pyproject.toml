[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obra-classifier"
version = "1.0.0"
description = "Classificação de fases de construção civil com YOLOv8 para monitoramento de obras."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Carlos Frederico Coelho Lisboa" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "albumentations>=2.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
train = ["ultralytics>=8.3"]
app = ["ultralytics>=8.3", "streamlit>=1.40", "requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
obra-classifier = "obra_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Dataclasses congeladas são imutáveis: seguras como valor padrão de argumento.
extend-immutable-calls = ["obra_classifier.config.ConfigDataset", "obra_classifier.config.ConfigTreino"]
